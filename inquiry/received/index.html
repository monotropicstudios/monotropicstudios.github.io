<!DOCTYPE html>

  <head>

      html, body { height: 100%; }

        margin: 1.25rem 0 0;

        line-height: 1.5;

      .return {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.35rem 1.35rem;
        margin: 2.25rem 0 0;
        padding: 0;
      }
      .return a {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        color: #c8c6c0;
        text-decoration: none;
        letter-spacing: 0.08em;
      }
      .return a:hover,
      .return a:focus-visible { color: #fff; }
      .return a:focus { outline: none; }
      .return a:focus-visible {
        outline: 1px solid rgba(255, 255, 255, 0.7);
        outline-offset: 4px;
      }
